[package]
name = "atlas-ntfs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Read NTFS volumes: MFT records, attribute lists, $I30 indexes, LZNT1 compression, alternate data streams and reparse points."
repository = "https://github.com/05Narwhal/atlas-ntfs"
homepage = "https://julianloy.com"
readme = "README.md"
keywords = ["ntfs", "filesystem", "windows", "mft", "parser"]
categories = ["filesystem", "parser-implementations"]
authors = ["Julian A. Loy"]

[dependencies]
atlas-fs-core = { version = "0.1", path = "X:/Documents/Coding/Projects/Libraries/Rust/atlas-fs-core" }

[dev-dependencies]
# SHA-256 of file content in the tests that read a real image.
sha2 = { version = "0.11", default-features = false }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "deny"
